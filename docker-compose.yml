# Local development infrastructure only.
# Production runs managed Postgres + Redis; see docs/06-SETUP-REQUIREMENTS.md.
services:
  postgres:
    image: postgres:16-alpine
    container_name: uncanned-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uncanned
      POSTGRES_PASSWORD: uncanned_local_dev
      POSTGRES_DB: uncanned_whatsapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uncanned -d uncanned_whatsapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uncanned-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
